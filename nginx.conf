# =============================================================================
# Vue3Admin 生产部署 Nginx 配置（根目录部署版，可直接使用）
#
# 配套说明见 docs/deployment.md，其中「根目录 vs 子路径」的差异有逐行对照。
#
# 本文件保证自包含，不依赖任何外部 include，复制后改 3 处即可上线：
#   1. server_name   -> 你的域名
#   2. ssl_certificate / ssl_certificate_key -> 证书路径
#   3. root          -> dist 解压目录
#
# -----------------------------------------------------------------------------
# 构建产物目录（必须与 Vite build.outDir 一致，本项目为 dist）：
#
#   dist/
#   ├── index.html                  <- SPA 入口，**不能**长缓存
#   ├── config.json                 <- 可选的运行时配置（见 src/config/runtime-config.ts）
#   ├── login-bg.svg
#   ├── assets/                     <- Vite 产出，**文件名带 hash**，可长缓存
#   │   ├── index-4f8a3c2d.js
#   │   └── index-9c1b2ea4.css
#   └── cesium/                     <- 由 build/cesium-assets-plugin.ts 拷贝
#       ├── Workers/                <- Cesium Web Worker（.js，少量 .wasm）
#       ├── Assets/                 <- 近似 IAU2006_XYS 等运行时数据
#       ├── Widgets/                <- 控件 CSS / 图片
#       └── ThirdParty/             <- 第三方运行库
#
# -----------------------------------------------------------------------------
# 关键原则（踩坑点都在 docs/deployment.md 有解释）：
#   - /api/ 必须在 SPA 回退之前被匹配，否则接口 404 会返回 index.html；
#   - try_files 的兜底必须是 /index.html，**不能**写成 =404；
#   - root 与 alias 不可混为一谈，需要时优先保证 trailing slash 一致；
#   - .wasm 必须显式声明 MIME，否则 Cesium 的 Worker 会加载失败；
# =============================================================================


# -----------------------------------------------------------------------------
# 后端 upstream
#
# 独立成块的理由：多个 location 共享同一地址；后端迁移只改一处；便于加健康检查。
# -----------------------------------------------------------------------------
upstream vue3_admin_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}


# -----------------------------------------------------------------------------
# 日志格式：额外输出 $request_time 与 $upstream_response_time，
# 用来区分「前端慢」还是「后端慢」，排查线上问题时非常省时间。
# -----------------------------------------------------------------------------
log_format vue3_admin_main '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" rt=$request_time urt=$upstream_response_time';


# -----------------------------------------------------------------------------
# HTTP -> HTTPS
#
# 如果你的 HTTPS 由 SLB / CDN 终止，整个 server 块可以直接删掉。
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # 让证书签发/校验（ACME challenge）走明文，其余全部跳转
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vue3-admin;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name example.com;

    access_log /var/log/nginx/vue3-admin.access.log vue3_admin_main;
    error_log  /var/log/nginx/vue3-admin.error.log warn;

    # --------------------------------------------------------------------------
    # TLS
    # --------------------------------------------------------------------------
    ssl_certificate     /etc/nginx/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # OCSP Stapling：省略会让首次握手多一次外部请求，明显变慢
    ssl_stapling        on;
    ssl_stapling_verify on;

    # 客户端最大请求体，含文件上传；按业务需要调整
    client_max_body_size 20m;

    # 大静态文件（Cesium 的地形/瓦片元数据、模型等）读取效率
    sendfile on;
    tcp_nopush on;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    # text/html 一定要开：index.html 不走长缓存，压缩收益最直接
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json application/xml image/svg+xml
                      application/wasm;
    # 已经压缩过的二进制不要重复压缩
    gzip_disable      "msie6";

    # --------------------------------------------------------------------------
    # 静态资源根目录
    #
    # 这里用 root，因为 URI 前缀与磁盘目录名一致（/assets/... -> /var/www/vue3-admin/assets/...）。
    #
    # 什么时候必须用 alias：
    #   仅当 location 前缀与磁盘目录名不一致时，例如把 dist 放在
    #   /var/www/vue3-admin/dist 却希望通过 /app/ 访问。此时写：
    #     location /app/ { alias /var/www/vue3-admin/dist/; }
    #   两个坑：
    #     1) alias 的目标目录**必须**以 / 结尾，否则 /app 会被拼成
    #        /var/www/vue3-admin/dist 并被当成文件路径，直接 403/404；
    #     2) alias 会丢弃 location 前缀后再拼接，因此 Vite 的 base 必须等于该前缀，
    #        否则产物里引用的 /assets/xxx.js 不会带上 /app，全部 404。
    # --------------------------------------------------------------------------
    root /var/www/vue3-admin;


    # ==========================================================================
    # 安全响应头
    #
    # 集中放在 server 级，配合每个 location 里的 add_header 使用。
    # 注意：Nginx 的 add_header 存在「就近覆盖」语义 —— 子块一旦出现 add_header，
    # 父块的 add_header 会**全部失效**。所以下面每个 location 如果对响应头有要求，
    # 都自带一份必要的头，不依赖继承。
    # ==========================================================================
    server_tokens off;

    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(self), camera=(), microphone=()" always;

    # CSP 解释：
    #  - worker-src blob: —— Cesium 通过 Blob URL 创建 Worker，缺了它三维页面直接白屏；
    #  - script-src 'unsafe-eval' —— Cesium 运行时存在字符串编译求值的需求；
    #    若你的页面不需要 Cesium，可以去掉 unsafe-eval 收紧策略；
    #  - img-src data: blob: —— Cesium 的瓦片/贴图大量使用 blob。
    add_header Content-Security-Policy   "default-src 'self'; "
                                         "script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; "
                                         "style-src 'self' 'unsafe-inline'; "
                                         "img-src 'self' data: blob:; "
                                         "font-src 'self' data:; "
                                         "connect-src 'self' https:; "
                                         "worker-src 'self' blob:; "
                                         "child-src 'self' blob:; "
                                         "object-src 'none'; "
                                         "base-uri 'self'; "
                                         "frame-ancestors 'self'" always;

    # HSTS：确认全站 HTTPS 且不会回退后再打开，否则会把用户锁死 max-age 时长
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


    # ==========================================================================
    # 1) API 反向代理
    #
    # 必须放在 SPA 回退之前。Nginx 的 location 匹配里，正则 ^~ 前缀匹配优先级
    # 高于普通前缀匹配，因此哪怕后面有 `location /` 也不会走到。
    #
    # proxy_pass 末尾是否带 / 的差异（最常见的双斜杠来源）：
    #   location /api/ + proxy_pass http://backend/   -> /api/users  => http://backend/users   （剥前缀）
    #   location /api/ + proxy_pass http://backend    -> /api/users  => http://backend/api/users（带前缀）
    #
    # 本项目 VITE_API_BASE_URL=/api，后端接口本身不带 /api，
    # 因此这里采用**带斜杠**的写法剥掉前缀。
    # 若你的后端接口自带 /api，请去掉 proxy_pass 末尾的 /，否则会出现 //api 或路径丢失。
    # ==========================================================================
    location ^~ /api/ {
        proxy_http_version 1.1;

        # 保持长连接，减少握手开销
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 超时按业务调整：报表导出、大模型推理类接口需要更长
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 接口响应不允许被中间层缓存
        proxy_buffering on;
        proxy_cache off;
        add_header Cache-Control "no-store" always;

        # 这里剥掉 /api 前缀（注意结尾的 /）
        proxy_pass http://vue3_admin_backend/;

        # 后端返回 401 时，前端 http 层会自行处理刷新/登出，
        # 这里**不要**用 error_page 去重定向，否则请求会变成 HTML 跳转，
        # 前端拿不到 JSON，反而触发解析异常。
    }


    # ==========================================================================
    # 2) Cesium 静态资源
    #
    # Cesium 运行时会按需拉取 Workers / Assets / Widgets / ThirdParty 下的文件。
    # 这些文件**不是** Vite 产物的一部分：它们是 cesium 包里直接拷贝出来的原始文件，
    # 文件名不带 hash，由 build/cesium-assets-plugin.ts 在 writeBundle 阶段复制。
    #
    # 要点：
    #  - 必须与前端 VITE_CESIUM_BASE_URL 保持一致：
    #      本文件把 URL 前缀定为 /cesium/（末尾斜杠），对应 env 里的 /cesium/
    #  - 单独设 access_log off 与 no-transform：这些文件量大且多为二进制，
    #    日志与 gzip 都是纯浪费；
    #  - immutable + 1y：Cesium 资源随 cesium 包版本变化，升级 cesium 时应同时
    #    改动接入方式（例如加版本路径 /cesium/1.146/），否则会命中旧缓存。
    # ==========================================================================
    location ^~ /cesium/ {
        # 资源在本机时直接由 Nginx 返回，不转发给后端
        root /var/www/vue3-admin;

        access_log off;
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Cesium 的 cesiumWorkerBootstrapper / transferTypedArrayTest 等 Worker
        # 依赖严格 MIME：application/javascript，不要让 default_type 覆盖它。
        types {
            application/javascript              js mjs;
            application/wasm                    wasm;
            application/json                    json;
            application/octet-stream            bin glb gltf ktx2 terrain;
            image/png                           png;
            image/jpeg                          jpg jpeg;
            image/webp                          webp;
            image/svg+xml                       svg;
            text/css                            css;
            font/woff                           woff;
            font/woff2                          woff2;
            text/plain                          txt;
        }

        try_files $uri =404;
    }


    # ==========================================================================
    # 3) 带 hash 的构建产物 —— 长缓存
    #
    # dist/assets 下的文件名由 Vite 打上内容 hash，内容变化必然换名，
    # 因此可以安全地 immutable。
    # ==========================================================================
    location ^~ /assets/ {
        root /var/www/vue3-admin;

        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        try_files $uri =404;
    }


    # ==========================================================================
    # 4) 运行时配置文件
    #
    # public/config.json 由 src/config/runtime-config.ts 读取，
    # 用于「一份产物部署多套环境」。它必须**不走**长缓存，
    # 否则改了后端地址而用户还在拿旧文件。
    # ==========================================================================
    location = /config.json {
        root /var/www/vue3-admin;
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }


    # ==========================================================================
    # 5) SPA 入口与 history 路由回退
    #
    # try_files 的三段含义：
    #   $uri       —— 命中真实文件（如 /login-bg.svg）
    #   $uri/      —— 命中目录
    #   /index.html —— 都不是就回退给前端路由（刷新 /system/user 不 404 的关键）
    #
    # 注意最后一段必须是内部条目 /index.html，不要写成 =404。
    # ==========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        # 入口 HTML **绝不能**长缓存：发版后用户会一直拿到引用了旧 hash 的 HTML。
        # no-cache 表示「每次都要向服务端校验」，配合 ETag 依然可以省流量。
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # favicon 缺失时不要落到 SPA 回退，减少无意义的 HTML 响应体积
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }
}


