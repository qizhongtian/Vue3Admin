<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="企业级 Vue 3 后台管理基础框架" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#2f6fed" />
    <title>%VITE_APP_TITLE%</title>
    <style>
      /* 首屏骨架，JS 加载完成后由 main.ts 移除，用于消除白屏 */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      #app-boot-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 16px;
        background: #f5f7fa;
        color: #606a7a;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          sans-serif;
      }

      #app-boot-loading .title {
        font-size: 14px;
        letter-spacing: 0.5px;
      }

      #app-boot-loading .bar {
        width: 180px;
        height: 3px;
        overflow: hidden;
        background: #e3e8ef;
        border-radius: 999px;
      }

      #app-boot-loading .bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #2f6fed;
        border-radius: 999px;
        animation: app-boot-indeterminate 1.2s ease-in-out infinite;
      }

      @keyframes app-boot-indeterminate {
        0% {
          transform: translateX(-100%);
        }

        100% {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-boot-loading">
        <div class="title">%VITE_APP_TITLE%</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <noscript>
      <div style="padding: 24px; text-align: center; font-size: 14px; color: #d03050">
        当前浏览器已禁用 JavaScript，请先开启后再访问本系统。
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
